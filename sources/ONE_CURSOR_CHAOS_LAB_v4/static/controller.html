<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<title>ONE CURSOR CHAOS LAB — Controller</title>
<style>
:root{--bg:#080a0f;--panel:#111521;--line:#273044;--text:#f5f7ff;--muted:#7f8aa3;--accent:#d8ff4f;--danger:#ff5d73;--cyan:#51e5ff;--violet:#b481ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:radial-gradient(circle at 50% -20%,#192139 0,#080a0f 55%);color:var(--text);font:600 16px/1.3 Inter,ui-sans-serif,system-ui,sans-serif;min-height:100svh;overflow:hidden}
main{min-height:100svh;display:flex;flex-direction:column;padding:18px;gap:16px}.logo{font-size:13px;letter-spacing:.24em;color:var(--muted)}.card{background:rgba(17,21,33,.86);border:1px solid var(--line);border-radius:24px;padding:18px;box-shadow:0 20px 80px #0008;backdrop-filter:blur(18px)}h1{font-size:28px;margin:8px 0 5px}.sub{color:var(--muted);font-weight:500}.hidden{display:none!important}.joinRow{display:flex;gap:9px;margin-top:16px}.nameInput{min-width:0;flex:1;border:1px solid var(--line);background:#0b0f18;color:white;border-radius:16px;padding:15px;font:700 16px system-ui;outline:none}.joinBtn{border:0;border-radius:16px;background:var(--accent);color:#090c11;padding:0 18px;font-weight:950}.capacity{margin-top:12px;color:#9ca6bb;font-size:13px}.roleWrap{flex:1;display:flex;flex-direction:column;gap:14px}.roleBadge{display:flex;align-items:center;justify-content:space-between}.roleName{font-size:13px;color:var(--muted);letter-spacing:.15em}.playerName{font-size:20px}.controls{flex:1;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;min-height:54svh;align-content:stretch}.ctrl{border:1px solid #323b52;background:linear-gradient(#171c2a,#0d111a);border-radius:24px;color:white;font-size:36px;font-weight:900;touch-action:none;box-shadow:inset 0 1px 0 #ffffff0f,0 16px 40px #0006;min-height:110px}.ctrl.wide{grid-column:1/-1}.ctrl small{display:block;font-size:11px;letter-spacing:.14em;color:#929db4;margin-top:6px}.ctrl:active,.ctrl.down{background:var(--accent);color:#0a0d13;transform:translateY(2px);box-shadow:0 6px 20px #0008}.ctrl.down small{color:#27300d}.ctrl.click{border-color:#6d8025}.ctrl.grab{border-color:#6e3c7d}.ctrl.boost{border-color:#365d80}.ctrl.brake{border-color:#7d4a4a}.ctrl.stabilize{border-color:#3d786a}.ctrl.focus{border-color:#745f8d}.missionCard{padding:14px 16px}.missionCard .mLabel{font-size:10px;letter-spacing:.14em;color:var(--accent);margin-bottom:5px}.missionCard .mTitle{font-size:14px;font-weight:900}.missionCard .mText{font-size:12px;color:var(--muted);margin-top:3px}.waiting{flex:1;display:grid;place-items:center;text-align:center}.dot{width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 20px var(--accent);display:inline-block;margin-right:8px}.toast{position:fixed;inset:auto 16px 18px 16px;background:#f5f7ff;color:#0b0e15;border-radius:18px;padding:14px 16px;font-weight:800;transform:translateY(150%);transition:.25s}.toast.show{transform:translateY(0)}
</style>
</head>
<body><main>
<div class="logo">ONE CURSOR // CHAOS LAB v4.1</div>
<section id="join" class="card"><div class="sub">Как тебя зовут?</div><h1>Займи свой слот 👀</h1><div class="joinRow"><input id="name" class="nameInput" maxlength="28" placeholder="Имя" autocomplete="nickname"><button id="joinBtn" class="joinBtn">JOIN</button></div><div id="capacity" class="capacity">Подключаемся…</div></section>
<section id="game" class="roleWrap hidden"><div class="card roleBadge"><div><div class="roleName">ТВОЁ УПРАВЛЕНИЕ</div><div class="playerName" id="me">—</div></div><div id="roleIcon" style="font-size:30px">⏳</div></div><div id="missionCard" class="card missionCard hidden"><div class="mLabel">ТЕКУЩАЯ ЦЕЛЬ</div><div id="mTitle" class="mTitle">—</div><div id="mText" class="mText">—</div></div><div id="controlArea" class="controls"></div></section>
<div id="waiting" class="waiting hidden"><div><div style="font-size:48px">📡</div><h1>Ты в игре</h1><div class="sub"><span class="dot"></span><span id="waitingText">Ждём остальных</span></div></div></div>
</main><div id="toast" class="toast"></div>
<script>
const $=s=>document.querySelector(s);
let ws,name=null,roles=[],pressed=new Set(),lobby={joined:0,playerLimit:4};
function connect(){const proto=location.protocol==='https:'?'wss':'ws';ws=new WebSocket(`${proto}://${location.host}/ws?type=controller`);ws.onopen=()=>{if(name)ws.send(JSON.stringify({type:'join',name}))};ws.onmessage=e=>handle(JSON.parse(e.data));ws.onclose=()=>setTimeout(connect,800)}
function handle(m){
 if(m.type==='lobby_state'){lobby=m;renderCapacity()}
 if(m.type==='joined'){name=m.name;$('#me').textContent=name;$('#join').classList.add('hidden');$('#waiting').classList.remove('hidden');if(Array.isArray(m.role)&&m.role.length)setRoles(m.role)}
 if(m.type==='join_error')toast(m.message)
 if(m.type==='role'){setRoles(Array.isArray(m.role)?m.role:[m.role].filter(Boolean));if(m.buzz&&navigator.vibrate)navigator.vibrate([80,40,80])}
 if(m.type==='controller_message'){toast(`${m.title||''}${m.text?' — '+m.text:''}`);$('#missionCard').classList.remove('hidden');$('#mTitle').textContent=m.title||'ЦЕЛЬ';$('#mText').textContent=m.text||'';if(m.buzz&&navigator.vibrate)navigator.vibrate([100,50,100])}
 if(m.type==='reset'){roles=[];$('#game').classList.add('hidden');$('#waiting').classList.remove('hidden')}
}
function renderCapacity(){const free=Math.max(0,(lobby.playerLimit||0)-(lobby.joined||0));$('#capacity').textContent=`Лобби: ${lobby.joined||0}/${lobby.playerLimit||'?'} · свободно ${free}`;$('#waitingText').textContent=`Подключено ${lobby.joined||0}/${lobby.playerLimit||'?'} · ждём старт`}
function join(){const n=$('#name').value.trim();if(!n)return toast('Введи имя');if(ws?.readyState===1)ws.send(JSON.stringify({type:'join',name:n}))}
$('#joinBtn').onclick=join;$('#name').addEventListener('keydown',e=>{if(e.key==='Enter')join()});
function send(control,state,value=null){if(ws?.readyState===1)ws.send(JSON.stringify({type:'input',control,state,value}))}
function setRoles(r){roles=r;pressed.clear();$('#waiting').classList.add('hidden');$('#game').classList.remove('hidden');renderControls();if(navigator.vibrate)navigator.vibrate(70)}
const meta={left:['←','ВЛЕВО'],right:['→','ВПРАВО'],up:['↑','ВВЕРХ'],down:['↓','ВНИЗ'],click:['●','CLICK'],grab:['✊','GRAB'],boost:['⚡','TURBO'],brake:['◼','BRAKE'],stabilize:['◎','STABILIZE'],focus:['◉','FOCUS']};
function renderControls(){const area=$('#controlArea');area.innerHTML='';$('#roleIcon').textContent=roles.length>1?'🎛️':(meta[roles[0]]?.[0]||'❔');roles.forEach((r,i)=>area.appendChild(btn(r,meta[r]?.[0]||'?',meta[r]?.[1]||r,roles.length===1)))}
function btn(control,icon,label,wide=false){const b=document.createElement('button');b.className=`ctrl ${control} ${wide?'wide':''}`;b.innerHTML=`${icon}<small>${label}</small>`;const down=e=>{e.preventDefault();if(pressed.has(control))return;pressed.add(control);b.classList.add('down');send(control,'down')};const up=e=>{e.preventDefault();if(!pressed.has(control))return;pressed.delete(control);b.classList.remove('down');send(control,'up')};b.addEventListener('pointerdown',down);['pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,up));return b}
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2200)}
connect();
</script></body></html>
