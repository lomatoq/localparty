<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0e12"><title>Твой контроллер · LocalParty</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="sports-controls.css"><script>/*SS_BOOT*/</script><script type="module" src="controls.js"></script></head><body data-ss-role="controller">
<header class="ss-controller-head"><div><small id="ss-connection">Подключаемся…</small><h1 id="ss-name">Твой контроллер</h1></div><div class="ss-utilities"><button id="ss-hand" class="ss-quiet" aria-label="Сменить ведущую руку"><img src="/assets/icons/game-pack/switch.svg" alt=""><span id="ss-hand-label"></span></button><button id="ss-sound" class="ss-quiet" aria-pressed="false" aria-label="Sound"><img src="/assets/icons/game-pack/mute.svg" alt=""><span id="ss-sound-label"></span></button></div></header>
<div data-hp-theme-preserve class="ss-controller-status ss-glass"><b id="ss-turn">Ждём остальных</b><span id="ss-personal">Смотри на общий экран</span><div class="ss-meter"><small id="ss-meter-label"></small><div class="ss-bar"><i id="ss-progress"></i></div></div></div>
<footer class="ss-controller-foot"><span id="ss-help"></span></footer><section id="ss-sports" hidden><div class="ss-throw-settings"><label><span>Позиция<output id="ss-position-value">0</output></span><input id="ss-position" type="range" min="-1" max="1" step=".05" value="0"></label><label><span>Подкрутка<output id="ss-spin-value">0</output></span><input id="ss-spin" type="range" min="-1" max="1" step=".05" value="0"></label></div><div id="ss-throw-pad" class="ss-throw-pad" role="application" aria-label="Проведи пальцем вверх, чтобы бросить"><canvas id="ss-gesture"></canvas><span id="ss-throw-hint">СВАЙПНИ ВВЕРХ<br><small>Скорость → сила · изгиб → подкрутка</small></span><b id="ss-power">0%</b><img id="ss-throw-art" class="ss-throw-ball" src="/assets/icons/atlas-stat-glyphs/pin.webp" alt=""><img class="ss-swipe-arrow" src="/assets/icons/game-pack/arrow-up.svg" alt=""></div><button id="ss-sweep" class="ss-primary ss-sweep" hidden>ДЕРЖИ, ЧТОБЫ ТЕРЕТЬ ЛЁД</button></section>
<section id="ss-shooter" class="ss-shooter" hidden><div class="ss-trigger-column"><button id="ss-fire" class="ss-fire hp-button-stack" aria-label="Удерживай для стрельбы"><img class="ss-action-art" src="/assets/icons/atlas-stat-glyphs/hit.webp" alt=""><span class="hp-button-label">ОГОНЬ</span></button><button id="ss-ability" class="ss-primary" disabled><img id="ss-ability-art" class="ss-action-art" src="/assets/gameplay/sports-siege/sprites/turret-pulse.webp" alt=""><span id="ss-ability-label">ПУЛЕМЁТ</span></button></div><div id="ss-aim-pad" class="ss-aim-pad" data-hp-theme-preserve role="application" aria-label="Тачпад прицеливания"><i id="ss-pad-crosshair"></i><span>ПРИЦЕЛ<br><small>Води пальцем, как по тачпаду</small></span></div></section>
<div id="ss-feedback" aria-live="polite"></div>
</body></html>
