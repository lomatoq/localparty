<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0e12"><title>Твой контроллер · LocalParty</title><link rel="stylesheet" href="style.css"><script>/*SS_BOOT*/</script><script type="module" src="controls.js"></script></head><body data-ss-role="controller">
<header class="ss-controller-head"><div><small id="ss-connection">Подключаемся…</small><h1 id="ss-name">Твой контроллер</h1></div><button id="ss-hand" class="ss-quiet" aria-label="Сменить ведущую руку">⇆</button></header>
<div class="ss-controller-status ss-glass"><b id="ss-turn">Ждём остальных</b><span id="ss-personal">Смотри на общий экран</span><div class="ss-bar"><i id="ss-progress"></i></div></div>
<section id="ss-sports" hidden><div class="ss-throw-settings"><label>Позиция<input id="ss-position" type="range" min="-1" max="1" step=".05" value="0"></label><label>Подкрутка<input id="ss-spin" type="range" min="-1" max="1" step=".05" value="0"></label></div><div id="ss-throw-pad" class="ss-throw-pad" role="application" aria-label="Проведи пальцем вверх, чтобы бросить"><canvas id="ss-gesture"></canvas><span id="ss-throw-hint">СВАЙПНИ ВВЕРХ<br><small>Скорость → сила · изгиб → подкрутка</small></span><b id="ss-power">0%</b><i class="ss-throw-ball"></i></div><button id="ss-sweep" class="ss-primary ss-sweep" hidden>ДЕРЖИ, ЧТОБЫ ТЕРЕТЬ ЛЁД</button></section>
<section id="ss-shooter" class="ss-shooter" hidden><div id="ss-aim-pad" class="ss-aim-pad" role="application" aria-label="Тачпад прицеливания"><i id="ss-pad-crosshair"></i><span>ПРИЦЕЛ<br><small>Води пальцем, как по тачпаду</small></span></div><div class="ss-trigger-column"><button id="ss-fire" class="ss-fire" aria-label="Удерживай для стрельбы"><span>◎</span>ОГОНЬ</button><button id="ss-ability" class="ss-primary" disabled>ПУЛЕМЁТ</button></div></section>
<footer class="ss-controller-foot"><span id="ss-help"></span><button id="ss-sound" class="ss-quiet" aria-pressed="false">Звук: выкл.</button></footer><div id="ss-feedback" aria-live="polite"></div>
</body></html>
