<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>LocalParty · Alpha</title><link rel="stylesheet" href="style.css"><script>/*SS_BOOT*/</script><script type="module" src="host.js"></script></head><body data-ss-role="host">
<div id="ss-scene" aria-label="Игровая 3D-сцена"></div>
<div class="ss-host-top"><div class="ss-glass ss-heading"><small id="ss-mode">LOCALPARTY / ALPHA</small><h1 id="ss-title"></h1><p id="ss-status" role="status">Подключаемся…</p></div><div class="ss-glass ss-metric"><small id="ss-metric-label">ГОТОВИМСЯ</small><strong id="ss-metric">—</strong><div class="ss-bar"><i id="ss-gate"></i></div></div></div>
<div id="ss-notice" class="ss-announcement" aria-live="polite"></div><div id="ss-scoreboard" class="ss-scoreboard"></div>

<div id="ss-error" class="ss-error" hidden role="alert"></div>
</body></html>
