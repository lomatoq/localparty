<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>LocalParty · Alpha</title><link rel="stylesheet" href="style.css"><script>/*SS_BOOT*/</script><script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script><script type="module" src="host.js"></script></head><body data-ss-role="host">
<div id="ss-scene" aria-label="Игровая 3D-сцена"></div>
<div class="ss-vignette" aria-hidden="true"></div>
<div class="ss-host-top"><div class="ss-glass ss-heading"><div class="ss-heading-line"><small id="ss-mode">LOCALPARTY / ALPHA</small><b id="ss-stage">ЛОББИ</b></div><div class="ss-heading-body"><div class="ss-heading-copy"><h1 id="ss-title"></h1><p id="ss-status" role="status">Подключаемся…</p></div><div class="ss-hud-stats" aria-label="Статус матча"><span><small id="ss-primary-label">ГОТОВИМСЯ</small><strong id="ss-primary-value">—</strong></span><span><small id="ss-secondary-label">ИГРОКИ</small><strong id="ss-secondary-value">0</strong></span></div></div></div></div>

<div id="ss-notice" class="ss-announcement" aria-live="polite"></div><div id="ss-scoreboard" class="ss-scoreboard"></div>
<section id="ss-overlay" class="ss-overlay"><div class="ss-glass ss-sheet"><span class="ss-eyebrow">ОДИН ЭКРАН. ВСЯ КОМПАНИЯ.</span><h2 id="ss-overlay-title">Собираемся?</h2><p id="ss-instructions"></p><div id="ss-settings"></div><p id="ss-roster"></p><button id="start" class="ss-primary" disabled>Начать игру ↗</button><button id="ss-again" class="ss-primary" hidden>Ещё матч ↗</button><div id="ss-results"></div></div></section>
<div id="ss-error" class="ss-error" hidden role="alert"></div>
</body></html>
