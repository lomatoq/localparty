<!doctype html><html lang="ru" data-party-layout="native-v2"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>LocalParty · Игровая площадка</title><link rel="stylesheet" href="game.css"></head><body class="ap-host">
<main id="ap-arena"><div id="ap-stage"></div><div class="ap-native-title"><h1 id="ap-title">Готовим площадку</h1></div>
<div class="ap-round"><b id="ap-status" role="status">Соединяемся…</b><span id="ap-subtitle"></span><div id="ap-health" hidden><span id="ap-health-label"></span><div><i></i></div></div></div>
<div class="ap-view-actions"><button id="ap-camera" class="ap-quiet" aria-pressed="false">◉ Следить</button><button id="ap-sound" class="ap-quiet" aria-pressed="false">Звук выкл.</button><select id="ap-quality" aria-label="Качество графики"><option value="auto">Авто</option><option value="low">Экономно</option></select></div>
<div id="ap-toast" class="ap-toast" aria-live="polite"></div>
<section id="ap-wait" class="ap-wait"><span class="ap-eyebrow">ПОЧТИ В СБОРЕ</span><h2>Готовность — на телефонах</h2><p id="ap-wait-copy">Подключайтесь через QR главного лобби.</p><label id="ap-frame-option" hidden>Длина партии <select id="ap-frames" aria-label="Длина партии"><option value="5">5 фреймов · Быстро</option><option value="10">10 фреймов · Классика</option></select></label><button id="start" class="ap-primary" disabled>Начать ↗</button></section>
<section id="ap-result" class="ap-result" hidden><span class="ap-eyebrow">ВОТ ЭТО БЫЛО!</span><h2></h2><p></p><button id="ap-again" class="ap-primary">Ещё партия ↗</button></section>
<div id="ap-error" class="ap-error" hidden role="alert"></div></main>
<footer class="ap-dock"><div id="ap-scores" class="ap-scores" aria-label="Счёт игроков"></div><p id="ap-hint" class="ap-hint"></p></footer>
<script type="module" src="host.js"></script></body></html>
