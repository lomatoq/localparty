<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LocalParty · Alpha</title><link rel="stylesheet" href="game.css"></head><body class="ap-host"><div id="ap-stage"></div><canvas id="ap-overlay"></canvas><header class="ap-hud"><div><small id="ap-kicker">LOCALPARTY / ALPHA</small><h1 id="ap-title">Готовим площадку…</h1><p id="ap-subtitle"></p></div><div class="ap-host-actions"><select id="ap-frames" aria-label="Длина партии"><option value="5">5 фреймов · Быстро</option><option value="10">10 фреймов · Классика</option></select><button id="ap-sound" class="ap-quiet">Звук выкл.</button><button id="start" class="ap-primary">Начать</button><button id="ap-again" class="ap-primary" hidden>Ещё партия</button></div></header><div id="ap-status" class="ap-status" role="status"></div><div id="ap-health" class="ap-health" hidden><span id="ap-health-label"></span><div><i></i></div></div><aside id="ap-scores" class="ap-scores"></aside><div id="ap-toast" class="ap-toast" aria-live="polite"></div><section id="ap-result" class="ap-result" hidden><small>ВОТ ЭТО БЫЛО!</small><h2></h2><p></p></section><footer id="ap-hint" class="ap-hint"></footer><div id="ap-error" class="ap-error" hidden role="alert"></div><script type="module" src="host.js"></script><script>
// The shared bridge deduplicates first starts by instance; rematches keep that instance.
window.addEventListener('message',e=>{if(parent===window||e.source!==parent||e.origin!==location.origin||e.data?.type!=='party-start'||e.data.instance!==parent.PARTY_INSTANCE)return;const b=document.getElementById('start');if(b&&!b.hidden&&!b.disabled)b.click();});
</script></body></html>
