<!doctype html><html lang="ru" data-party-layout="native-v2"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Контроллер LocalParty</title><link rel="stylesheet" href="game.css"></head><body class="ap-controller">
<header class="ap-phone-head"><div><small id="ap-you">ТВОЙ КОНТРОЛЛЕР</small><h1 id="ap-state">Соединяемся…</h1></div><button id="ap-hand" class="ap-quiet" aria-label="Поменять ведущую руку">⇄ Правая</button></header>
<div id="ap-phone-meter" role="status"><i></i><span>Ждём остальных</span></div>
<section id="ap-sports" hidden><div class="ap-swipe-wrap"><canvas id="ap-swipe" aria-label="Проведи снизу вверх: длина и скорость задают силу броска"></canvas><output id="ap-gesture-value" aria-live="off"></output><span class="ap-swipe-hint">Сила · направление · подкрутка</span></div><div class="ap-sliders"><label>Позиция <input id="ap-offset" type="range" min="-1" max="1" step=".02" value="0"></label><label>Подкрутка <input id="ap-spin" type="range" min="-1" max="1" step=".05" value="0"></label></div><div class="ap-sport-actions"><button id="ap-precise-open" class="ap-quiet">Точный бросок</button><button id="ap-sweep" class="ap-primary" hidden>Щётка · держи</button></div></section>
<section id="ap-shooter" hidden><div class="ap-shoot-controls"><div id="ap-aim" role="application" aria-label="Тачпад прицела"><span>ПРИЦЕЛ<small>Води и переставляй палец</small></span><i id="ap-aim-dot"></i></div><button id="ap-fire" class="ap-fire" aria-label="Удерживай для стрельбы"><b>◎</b><small>ОГОНЬ</small></button></div><button id="ap-ability" class="ap-primary" disabled>Способность</button><label class="ap-sensitivity">Чувствительность <input id="ap-sensitivity" type="range" min=".4" max="1.8" step=".05" value="1"></label></section>
<footer class="ap-phone-foot"><p id="ap-instruction"></p><small id="ap-network" role="status">Подключаемся</small></footer><p id="ap-feedback" role="status" aria-live="polite"></p>
<dialog id="ap-precise" class="ap-dialog"><form method="dialog"><button class="ap-quiet ap-close" aria-label="Закрыть">×</button></form><h2>Точный бросок</h2><p>Те же правила, без жеста. Позиция и подкрутка берутся с основного экрана.</p><label>Сила <input id="ap-power" type="range" min=".1" max="1" step=".01" value=".55"></label><label>Направление <input id="ap-angle" type="range" min="-1" max="1" step=".02" value="0"></label><button id="ap-throw" class="ap-primary">Бросить ↗</button></dialog>
<div id="ap-error" class="ap-error" hidden role="alert"></div><script src="rules.js"></script><script src="controls.js"></script></body></html>
