<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Контроллер LocalParty</title><link rel="stylesheet" href="game.css"></head><body class="ap-controller"><header class="ap-phone-head"><div><small id="ap-you">LOCALPARTY</small><h1 id="ap-state">Подключаемся…</h1></div><button id="ap-hand" class="ap-quiet" aria-label="Поменять руку">⇄ Рука</button></header><p id="ap-instruction" class="ap-instruction"></p><div id="ap-phone-meter"><i></i><span></span></div><section id="ap-sports" hidden><canvas id="ap-swipe" aria-label="Свайпни снизу вверх для броска"></canvas><div class="ap-sliders"><label>Позиция <input id="ap-offset" type="range" min="-1" max="1" step=".02" value="0"></label><label>Подкрутка <input id="ap-spin" type="range" min="-1" max="1" step=".05" value="0"></label><details><summary>Точный бросок без свайпа</summary><label>Сила <input id="ap-power" type="range" min=".1" max="1" step=".01" value=".55"></label><label>Направление <input id="ap-angle" type="range" min="-1" max="1" step=".02" value="0"></label><button id="ap-throw" class="ap-primary">Бросить</button></details></div><button id="ap-sweep" class="ap-primary" hidden>🧹 Тереть лёд · удерживай</button></section><section id="ap-shooter" hidden><div class="ap-shoot-controls"><div id="ap-aim" role="application" aria-label="Тачпад прицела"><div class="ap-aim-grid"></div><span>Веди прицел<br><small>Можно переставлять палец</small></span><i id="ap-aim-dot"></i></div><button id="ap-fire" class="ap-fire" aria-label="Стрелять">◎<small>ОГОНЬ</small></button></div><button id="ap-ability" class="ap-primary" disabled>Способность</button><label class="ap-sensitivity">Чувствительность <input id="ap-sensitivity" type="range" min=".4" max="1.8" step=".05" value="1"></label></section><p id="ap-feedback" role="status" aria-live="polite"></p><div id="ap-error" class="ap-error" hidden role="alert"></div><script src="rules.js"></script><script src="controls.js"></script></body></html>
