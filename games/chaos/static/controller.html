<body><main>
<div class="logo">ONE CURSOR // CHAOS LAB v4.1</div>
<section id="join" class="card"><div class="sub">Как тебя зовут?</div><h1>Займи свой слот 👀</h1><div class="joinRow"><input id="name" class="nameInput" maxlength="28" placeholder="Имя" autocomplete="nickname"><button id="joinBtn" class="joinBtn">JOIN</button></div><div id="capacity" class="capacity">Подключаемся…</div></section>
<section id="game" class="roleWrap hidden"><div class="card roleBadge"><div><div class="roleName">ТВОЁ УПРАВЛЕНИЕ</div><div class="playerName" id="me">—</div></div><div id="roleIcon" style="font-size:30px">⏳</div></div><div id="missionCard" class="card missionCard hidden"><div class="mLabel">ТЕКУЩАЯ ЦЕЛЬ</div><div id="mTitle" class="mTitle">—</div><div id="mText" class="mText">—</div></div><div id="controlArea" class="controls"></div></section>
<div id="waiting" class="waiting hidden"><div><div style="font-size:48px">📡</div><h1>Ты в игре</h1><div class="sub"><span class="dot"></span><span id="waitingText">Ждём остальных</span></div></div></div>
</main><div id="toast" class="toast"></div>
<script>
const $=s=>document.querySelector(s);
let movement={x:0,y:0},movePointer=null;const releaseHandlers=[];let ws,name=window.PARTY_PROFILE?.name||localStorage.getItem('chaos_name')||null,roles=[],pressed=new Set(),lobby={joined:0,playerLimit:4};
function connect(){const proto=location.protocol==='https:'?'wss':'ws';ws=new WebSocket(`${proto}://${location.host}/ws?type=controller`);ws.onopen=()=>{if(name)ws.send(JSON.stringify({type:'join',name,id:localStorage.getItem('chaos_id'),token:localStorage.getItem('chaos_token'),partyId:window.PARTY_PROFILE?.id,partyToken:window.PARTY_PROFILE?.token}))};ws.onmessage=e=>handle(JSON.parse(e.data));ws.onclose=e=>{if(e.code!==4001)setTimeout(connect,800);else toast('Этот игрок подключился в другой вкладке')}}
function handle(m){
 if(m.type==='lobby_state'){lobby=m;renderCapacity()}
 if(m.type==='joined'){name=m.name;localStorage.setItem('chaos_name',name);localStorage.setItem('chaos_id',m.id);localStorage.setItem('chaos_token',m.token);$('#me').textContent=name;$('#join').classList.add('hidden');$('#waiting').classList.remove('hidden');if(Array.isArray(m.role)&&m.role.length)setRoles(m.role)}
 if(m.type==='join_error')toast(m.message)
 if(m.type==='role'){setRoles(Array.isArray(m.role)?m.role:[m.role].filter(Boolean));if(m.buzz&&navigator.vibrate)navigator.vibrate([80,40,80])}
 if(m.type==='controller_message'){toast(`${m.title||''}${m.text?' — '+m.text:''}`);$('#missionCard').classList.remove('hidden');$('#mTitle').textContent=m.title||'ЦЕЛЬ';$('#mText').textContent=m.text||'';if(m.buzz&&navigator.vibrate)navigator.vibrate([100,50,100])}
 if(m.type==='results'){releaseAll();roles=[];$('#controlArea').classList.add('hidden');$('#waiting').classList.add('hidden');$('#game').classList.remove('hidden');$('#missionCard').classList.remove('hidden');$('.mLabel').textContent='ИТОГ ЭКСПЕРИМЕНТА';$('#mTitle').textContent=m.levels+' уровней пройдены!';$('#mText').textContent=m.score+' очков. Ещё одну игру можно запустить на общем экране.';}
 if(m.type==='reset'){roles=[];$('#game').classList.add('hidden');$('#waiting').classList.remove('hidden')}
}
function renderCapacity(){const free=Math.max(0,(lobby.playerLimit||0)-(lobby.joined||0));$('#capacity').textContent=`Лобби: ${lobby.joined||0}/${lobby.playerLimit||'?'} · свободно ${free}`;$('#waitingText').textContent=`Подключено ${lobby.joined||0}/${lobby.playerLimit||'?'} · ждём старт`}
function join(){const n=$('#name').value.trim();if(!n)return toast('Введи имя');if(ws?.readyState===1)ws.send(JSON.stringify({type:'join',name:n,id:localStorage.getItem('chaos_id'),token:localStorage.getItem('chaos_token'),partyId:window.PARTY_PROFILE?.id,partyToken:window.PARTY_PROFILE?.token}))}
$('#joinBtn').onclick=join;$('#name').addEventListener('keydown',e=>{if(e.key==='Enter')join()});
function send(control,state,value=null){if(ws?.readyState===1)ws.send(JSON.stringify({type:'input',control,state,value}))}
function setRoles(r){$('#controlArea').classList.remove('hidden');$('.mLabel').textContent='ТЕКУЩАЯ ЦЕЛЬ';releaseAll();roles=r;pressed.clear();$('#waiting').classList.add('hidden');$('#game').classList.remove('hidden');renderControls();if(navigator.vibrate)navigator.vibrate(70)}
const meta={left:['←','ВЛЕВО'],right:['→','ВПРАВО'],up:['↑','ВВЕРХ'],down:['↓','ВНИЗ'],click:['●','CLICK'],grab:['✊','GRAB'],boost:['⚡','TURBO'],brake:['◼','BRAKE'],stabilize:['◎','STABILIZE'],focus:['◉','FOCUS']};
function renderControls(){const area=$('#controlArea');area.innerHTML='';releaseHandlers.length=0;$('#roleIcon').textContent='↗';if(roles.includes('move')){const pad=document.createElement('div');pad.className='vector-pad';pad.innerHTML='<span>ВСЕ ДВИГАЮТ КУРСОР ВМЕСТЕ</span><small>Держи и веди пальцем · направление усредняется</small><i class="vector-knob"></i>';const knob=pad.querySelector('i');let origin=null;function update(e){const r=pad.getBoundingClientRect(),radius=Math.min(r.width,r.height)*.35;let x=(e.clientX-(r.left+r.width/2))/radius,y=(e.clientY-(r.top+r.height*.62))/radius;const len=Math.max(1,Math.hypot(x,y));movement={x:x/len,y:y/len};knob.style.transform='translate(calc(-50% + '+movement.x*radius+'px),calc(-50% + '+movement.y*radius+'px))';send('move','down',movement);}function release(){movePointer=null;movement={x:0,y:0};knob.style.transform='translate(-50%,-50%)';send('move','up',movement);}releaseHandlers.push(release);pad.onpointerdown=e=>{e.preventDefault();if(movePointer!==null)return;movePointer=e.pointerId;pad.setPointerCapture(movePointer);update(e)};pad.onpointermove=e=>{if(e.pointerId===movePointer)update(e)};for(const ev of ['pointerup','pointercancel','lostpointercapture'])pad.addEventListener(ev,e=>{if(e.pointerId===movePointer)release()});area.appendChild(pad);}for(const control of roles.filter(r=>r!=='move')){const b=btn(control,'',control==='precision'?'ТОЧНОСТЬ':control==='grab'?'GRAB':'CLICK'),icon=b.querySelector('.hp-button-icon');icon.style.setProperty('--chaos-icon',`url('/assets/icons/game-pack/${control==='precision'?'target':control==='grab'?'anchor':'cursor-default'}.svg')`);area.insertBefore(b,area.querySelector('.vector-pad'));}}
function btn(control,icon,label){const b=document.createElement('button');b.className='ctrl hp-button-stack';b.setAttribute('aria-pressed','false');b.innerHTML='<span class="hp-button-icon" aria-hidden="true">'+icon+'</span><small class="hp-button-label">'+label+'</small>';let pointer=null,keyHeld=null;function sync(){const down=pointer!==null||keyHeld!==null;if(down)pressed.add(control);else pressed.delete(control);b.classList.toggle('down',down);b.setAttribute('aria-pressed',String(down));send(control,down?'down':'up');}function release(){pointer=null;keyHeld=null;sync();}releaseHandlers.push(release);b.onpointerdown=e=>{e.preventDefault();if(pointer!==null||b.disabled)return;pointer=e.pointerId;b.setPointerCapture(pointer);sync();};for(const ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,e=>{if(pointer===e.pointerId){pointer=null;sync();}});b.addEventListener('keydown',e=>{if(![' ','Enter'].includes(e.key))return;e.preventDefault();if(e.repeat||b.disabled||keyHeld!==null)return;keyHeld=e.key;sync();});b.addEventListener('keyup',e=>{if(e.key!==keyHeld)return;e.preventDefault();keyHeld=null;sync();});b.addEventListener('blur',release);return b;}
function releaseAll(){movement={x:0,y:0};for(const release of releaseHandlers)release();pressed.clear();}
window.addEventListener('blur',releaseAll);document.addEventListener('visibilitychange',()=>{if(document.hidden)releaseAll()});setInterval(()=>{if(!roles.length)return;send('move','down',movement);for(const control of pressed)send(control,'down');},100);
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2200)}
connect();
