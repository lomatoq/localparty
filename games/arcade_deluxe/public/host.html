<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Local Party / Arcade</title><link rel="stylesheet" href="style.css"><link rel="icon" href="assets/icon.svg" type="image/svg+xml"></head><body><script>/*ARCADE_BOOT*/</script>
<header class="header"><div class="brand"><i class="brand-mark"></i><div>local party<small>ARCADE COLLECTION / 06</small></div></div><div class="status" id="connection">Подключение…</div></header>
<main class="host-main"><section class="arena"><canvas id="game" width="1280" height="720" aria-label="Общее игровое поле"></canvas><div class="arena-head"><h1 class="game-wordmark" id="wordmark"></h1><div class="round-badge"><strong id="roundLabel"></strong><div id="subLabel"></div></div></div><div class="score-strip" id="scores"></div>
<div class="waiting-card" id="overlay"><div class="eyebrow" id="overlayTag">LOCAL MULTIPLAYER</div><h2 id="overlayTitle">Подключайтесь к игре</h2><div id="overlayCopy"></div><div class="settings-select" id="settings"></div><div class="actions" id="actions"><button class="primary" id="start">Начать матч</button><button class="purple" id="practice">Тренировка</button><button class="ghost" id="demo">Демо с ботами</button><button class="primary hidden" id="reset">Ещё раз</button></div><div class="join-address" id="joinAddress"></div></div><div class="pause-cover hidden" id="paused">Пауза</div>
</section><section id="retroBar" class="retro-bar hidden" aria-label="Параметры текущего выстрела">
 <div class="retro-logo">POCKET<br><em>SIEGE</em><small>LOCAL PARTY / 06</small></div>
 <div class="retro-meter retro-move"><label>MOVE</label><div class="step-control"><button id="retroMoveLeft" class="party-display-answer" aria-label="Двигаться влево">«</button><b id="retroMove">100</b><button id="retroMoveRight" class="party-display-answer" aria-label="Двигаться вправо">»</button></div></div>
 <button id="retroFire" class="retro-fire party-display-answer" disabled>Fire</button>
 <div class="retro-meter retro-angle"><label>ANGLE</label><div class="step-control"><button id="retroAngleDown" class="party-display-answer" aria-label="Уменьшить угол">‹</button><b id="retroAngle">45°</b><button id="retroAngleUp" class="party-display-answer" aria-label="Увеличить угол">›</button></div></div>
 <div class="retro-weapon"><label>WEAPON</label><div class="retro-weapon-display"><span id="retroWeaponIcon" class="retro-weapon-icon"></span><b id="retroWeapon">Выберите оружие</b><div class="weapon-cycle"><button id="retroWeaponPrev" class="party-display-answer" aria-label="Предыдущее оружие">▴</button><button id="retroWeaponNext" class="party-display-answer" aria-label="Следующее оружие">▾</button></div></div></div>
 <div class="retro-power"><label>POWER</label><div class="power-track"><i id="retroPowerFill"></i></div><div class="step-control"><button id="retroPowerDown" class="party-display-answer" aria-label="Уменьшить силу">‹</button><b id="retroPower">65</b><button id="retroPowerUp" class="party-display-answer" aria-label="Увеличить силу">›</button></div></div>
 <div class="retro-detail"><span id="retroWeaponDetail">Угол и сила задают начальную траекторию.</span><small id="retroState">ОЖИДАНИЕ</small></div>
 </section><footer class="host-footer"><div class="help" id="help"></div><div class="local-dock hidden" id="localDock"><label id="localWeaponWrap">Оружие<select id="localWeapon"></select></label><label id="localPowerWrap">Сила <span id="localPowerValue">65</span><input id="localPower" type="range" min="8" max="100" value="65"></label><button class="primary" id="localFire">Выстрел · Space</button><button id="localSwap">Сменить · X</button></div><div class="host-tools"><button class="small ghost" id="sound">Звук выключен</button><button class="small ghost" id="fullscreen">На весь экран</button></div></footer></main><div class="toast hidden" id="toast"></div><script type="module" src="host.js"></script></body></html>
