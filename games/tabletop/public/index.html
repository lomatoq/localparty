<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>LocalParty</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="arena.css"><script defer src="fx.js"></script><script defer src="app.js"></script></head><body>
<main id="tabletop"><header><span id="eyebrow">LOCALPARTY</span><h1 id="title">READY TO PLAY</h1><p id="status" role="status">Connecting…</p></header>
<form id="join" hidden><label for="nickname">Name</label><input id="nickname" maxlength="24" autocomplete="nickname"><button>JOIN</button></form>
<button id="start" hidden>START</button>
<section id="poker" hidden><div class="felt tv-only"><span id="pot"></span><div id="community" class="cards"></div><p id="handStatus"></p></div><p id="myPokerStatus" class="phone-only"></p><div id="hole" class="cards phone-only"></div><div id="actions"><button data-action="fold">FOLD</button><button id="call" data-action="call">CALL</button><label id="raiseLabel" for="raise">Raise to</label><input id="raise" type="number" inputmode="numeric" min="20" step="10"><button id="raiseButton">RAISE</button></div></section>
<section id="mines" hidden><p id="mineHelp"></p><div id="grid" class="tv-only" aria-label="Mine field"></div><div class="phone-only mine-controls"><strong id="mineCoordinate">E5</strong><div class="dpad"><button data-direction="up" aria-label="Up">▲</button><button data-direction="left" aria-label="Left">◀</button><button data-direction="down" aria-label="Down">▼</button><button data-direction="right" aria-label="Right">▶</button></div><button id="mineOpen">OPEN TILE</button></div></section>
<section id="airhockey" hidden><div id="goals"></div><canvas id="rink" class="tv-only" width="1000" height="600" aria-label="Air hockey rink"></canvas><div id="hockeyJoy" class="phone-only joystick" role="group" aria-label="Move your striker"><span id="hockeyKnob"></span></div><p id="hockeyHelp"></p></section>
<section id="players" aria-label="Players"></section><p id="error" role="alert"></p></main></body></html>
