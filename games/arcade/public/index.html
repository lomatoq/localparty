<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#151321"><link rel="stylesheet" href="style.css"><script src="arcade-juice.js" defer></script><script src="app.js" defer></script></head><body><main class="controller"><form id="join"><input id="nickname" maxlength="24" placeholder="Имя" required><button class="primary">Войти</button></form><h2 id="name"></h2><section class="arcade-readout" aria-label="Game state"><img id="arcadeCue" class="arcade-cue" alt="" hidden><p id="status" role="status">Подключаемся</p><small id="help"></small></section><div class="arcade-controls"><div id="joy" class="joystick-base" aria-label="Джойстик: веди пальцем для движения или поворота" hidden><span id="knob" class="joystick-knob"></span></div><button id="motion" hidden>Включить датчик движения</button><button id="action" class="primary throw-btn">ТАП!</button></div></main></body></html>
