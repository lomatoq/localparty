<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Башня терпения — пульт</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="action-glass.css"></head><body><header><div><small>БАШНЯ ТЕРПЕНИЯ</small><b id="name">Подключение</b></div><div id="timer" data-party-timer>30с</div></header><form id="join"><input id="nickname" placeholder="Твоё имя" maxlength="24"><button>ВОЙТИ</button></form><main class="phone"><div id="turn" class="turn">Ждём башню…</div><canvas id="tower" width="620" height="400"></canvas><p id="notice">Выбери блок и осторожно вытягивай.</p><section id="controls"><label>СЛОЙ <select id="layer"></select></label><div id="blocks" class="block-buttons"></div><div class="joystick-wrap"><div class="joystick-hints"><b>↑ ВЕРНУТЬ</b><span>← боковое давление →</span><b>↓ ВЫТЯНУТЬ</b></div><div id="jengaJoystick" role="application" aria-label="Джойстик вытягивания блока" aria-disabled="true"><div id="jengaKnob"></div></div><strong id="jengaForce">Выбери блок</strong><small>Дальше от центра — быстрее и сильнее.<br>Отпусти палец, чтобы остановиться.</small></div></section><div id="board"></div></main><script src="app.js"></script><script src="joystick.js"></script><script type="module" src="renderer3d.js"></script><script src="touch-feedback.js"></script></body></html>
