<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Башня терпения — пульт</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="action-glass.css"><link rel="stylesheet" href="controller.css"></head><body><header><div><small>БАШНЯ ТЕРПЕНИЯ</small><b id="name">Подключение</b></div><div id="timer" data-party-timer>30с</div></header><form id="join"><input id="nickname" placeholder="Твоё имя" maxlength="24"><button>ВОЙТИ</button></form><main class="phone jenga-console"><div class="jenga-task"><b id="turn" class="turn">Waiting for the tower</b><p id="notice"></p></div><section class="jenga-support" aria-label="Choose a support"><div class="jenga-selection" data-hp-theme-preserve><h2 id="jengaSupportTitle">Choose a support</h2><div class="jenga-layer-control"><button type="button" id="layerDown" aria-label="Lower layer">−</button><label><span>Layer</span><strong id="layerValue">—</strong><select id="layer" aria-label="Layer"></select></label><button type="button" id="layerUp" aria-label="Higher layer">+</button></div><div id="blocks" class="block-buttons"></div></div><button type="button" id="jengaChangeSupport" class="jenga-selected-station"><span id="jengaSelectedSupport">Selected support</span><small>Change</small></button><div class="jenga-tower-frame"><canvas id="tower" width="620" height="620" aria-label="Live tower and selected block"></canvas></div></section><div id="board" aria-label="Crew standings"></div><section id="controls"><div class="jenga-watch-selection" id="jengaWatchSelection" aria-live="polite">No block selected yet</div><div class="jenga-motion"><div class="jenga-input-status"><strong id="jengaForce">Select a block</strong></div><div class="joystick-wrap"><div class="jenga-direction jenga-push"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20V4m-6 6 6-6 6 6"/></svg><span>Push back</span></div><div class="jenga-side jenga-side-left"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12H4m6-6-6 6 6 6"/></svg></div><div id="jengaJoystick" role="application" aria-label="Move selected block: down to pull, up to return, sideways to loosen" aria-disabled="true"><div id="jengaKnob"></div></div><div class="jenga-side jenga-side-right"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h16m-6-6 6 6-6 6"/></svg></div><div class="jenga-direction jenga-pull"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v16m-6-6 6 6 6-6"/></svg><span>Pull out</span></div><p class="jenga-input-note">Sideways to loosen · Release to stop</p></div></div></section></main><script src="app.js"></script><script src="joystick.js"></script><script src="controller.js"></script><script type="module" src="renderer3d.js"></script><script src="touch-feedback.js"></script></body></html>
