name: Alpha validation
on:
  push:
    branches: [alpha/party-sports-siege]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: localparty-alpha
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Rules, physics and updater tests
        run: |
          mkdir -p test-results/afterparty
          set -o pipefail
          node --test tests/afterparty.test.js tests/afterparty-regression.test.js tests/updater.test.js 2>&1 | tee test-results/afterparty/afterparty-test.log
      - name: Install browser-test tools without changing lockfile
        run: |
          npm install --no-save --package-lock=false playwright@1.57.0
          npx playwright install --with-deps chromium
      - name: Four 3D games, mobile controls and managed lobby
        run: node -r ./tests/afterparty-browser-diagnostics.cjs tests/afterparty-browser.cjs
      - name: Original game and launcher regression tests
        if: always() && !cancelled()
        run: |
          mkdir -p test-results/afterparty
          set -o pipefail
          timeout --kill-after=5s 180s npm test 2>&1 | tee test-results/afterparty/npm-test.log
      - name: Optional screenshots and logs (repository artifact quota may be exhausted)
        uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: afterparty-validation
          path: test-results/afterparty
          retention-days: 7
