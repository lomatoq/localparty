name: iOS show and UI regressions
on:
  push:
    branches: ['codex/ios-unified-host-20260917']
    paths: ['public/**', 'lib/**', 'server.js', 'ios/**', 'tests/**', 'scripts/**', '.github/workflows/ios-show-validation.yml', '.github/source-edits/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-show-${{ github.ref }}
  cancel-in-progress: true
jobs:
  materialize:
    if: github.ref == 'refs/heads/codex/ios-unified-host-20260917'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.integrate.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Apply this reviewed text delta once, with exact before/after hashes
        id: integrate
        env:
          WORK_BRANCH: codex/ios-unified-host-20260917
        run: |
          set -euo pipefail
          if test -d .github/source-edits; then
            python3 - <<'PY'
          import hashlib,json,subprocess
          from pathlib import Path
          root=Path.cwd().resolve();folder=root/'.github/source-edits'
          pinned={
            'manifest.json':'08364c10323e210f105c98a610bf55b763ea05facc841adc4a2af10e0485b12e',
            '01.patch':'abca66e03cbdea7221ed0fe7fd74b5e39bd117e81dd58b5cd4a0298ba5202511',
            '02.patch':'7d6236b1906b503bed0cc9f64319ed86a9afd008550d27b56728995779fddd1d',
            '03.patch':'fea458e04910842286efe46c0fc0ae8c11b9ce4512e03373725fc2dda45edc41',
            '04.patch':'a0ceace3b3e866256beeba397ef1e7239046da34c182a90d6dca28737eaf6975'
          }
          def digest(p):return hashlib.sha256(p.read_bytes()).hexdigest()
          for name,expected in pinned.items():
            if digest(folder/name)!=expected:raise SystemExit('Delta content mismatch: '+name)
          manifest=json.loads((folder/'manifest.json').read_text())
          def safe(name):
            p=root/name
            if p.is_symlink() or p.resolve()!=p.absolute() or not p.is_file() or not p.resolve().is_relative_to(root):raise SystemExit('Unsafe source path: '+name)
            return p
          for e in manifest['edits']:
            if digest(safe(e['path']))!=e['before']:raise SystemExit('Unexpected base source: '+e['path'])
          for e in manifest['verify']:
            if digest(safe(e['path']))!=e['sha256']:raise SystemExit('New source mismatch: '+e['path'])
          patches=[str(folder/n) for n in pinned if n.endswith('.patch')]
          stats=subprocess.check_output(['git','apply','--numstat','--unidiff-zero',*patches],text=True)
          paths=[line.split('\t',2)[2] for line in stats.strip().splitlines()]
          expected={e['path'] for e in manifest['edits']}
          if set(paths)!=expected or len(paths)!=len(expected):raise SystemExit('Unexpected delta paths')
          subprocess.run(['git','apply','--check','--unidiff-zero',*patches],check=True)
          subprocess.run(['git','apply','--index','--unidiff-zero',*patches],check=True)
          for e in manifest['edits']:
            if digest(safe(e['path']))!=e['after']:raise SystemExit('Final source mismatch: '+e['path'])
          print('Verified exact bytes for',len(manifest['edits'])+len(manifest['verify']),'source files')
          PY
            git rm -r .github/source-edits
            git diff --cached --check
            git config user.name 'LocalParty source integration'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Integrate verified TV show, admin controls, native haptics and layout updates'
            git push origin "HEAD:refs/heads/$WORK_BRANCH"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  check:
    needs: materialize
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.materialize.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Reproducible text source snapshot (no runtime data or credentials)
        run: |
          mkdir -p .localparty-build/ci
          git rev-parse HEAD > .localparty-build/ci/tested-sha.txt
          python3 - <<'PY'
          import subprocess, zipfile
          from pathlib import Path
          suffixes={'.js','.cjs','.mjs','.css','.html','.json','.swift','.plist','.py','.sh','.md','.pbxproj','.yml'}
          with zipfile.ZipFile('.localparty-build/ci/review-source.zip','w',zipfile.ZIP_DEFLATED) as z:
            for name in subprocess.check_output(['git','ls-files','-z']).decode().split('\0'):
              p=Path(name)
              if p.is_file() and p.suffix in suffixes and not name.startswith(('data/','public/assets/','runtime-cache/')):
                z.write(p,name)
          PY
      - name: Install pinned project dependencies
        run: npm ci --ignore-scripts
      - name: Source and unit checks
        run: |
          node --test tests/native-shell.test.cjs tests/fresh-lobby.test.cjs tests/tv-director.test.cjs
          python3 tests/test_ios_product.py
          python3 tests/test_show_product.py
          node tests/tv-show-integration.cjs
      - name: Install browser runner
        run: |
          python3 -m pip install playwright==1.57.0
          python3 -m playwright install --with-deps chromium
      - name: Full checkout UI checks
        run: |
          python3 tests/native-shell-browser.py
          python3 tests/fresh-lobby-browser.py
          python3 tests/tv-show-browser.py
      - name: Existing repository tests
        run: npm test
      - name: Reports and reproducibility snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-show-review
          path: .localparty-build
          include-hidden-files: true
          retention-days: 5
          if-no-files-found: warn
