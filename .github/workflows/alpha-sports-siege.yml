name: Alpha sports and siege
on:
  push:
    branches: ['alpha/sports-siege-swipe']
  pull_request:
    paths: ['games/sports_siege/**', 'lib/update*', 'lib/catalog.js', 'public/updates.*', 'tests/alpha*', 'tests/sports-siege.test.js', 'server.js']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: alpha-sports-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts > /tmp/alpha-install.log 2>&1 || { tail -n 30 /tmp/alpha-install.log; exit 1; }
      - name: New rules, real physics, sockets, updater transactions
        run: |
          node --test tests/sports-siege.test.js tests/alpha-updater.test.js tests/alpha-physics.test.js tests/alpha-network.test.js tests/alpha-start.test.js > /tmp/alpha-tests.log 2>&1 || { tail -n 80 /tmp/alpha-tests.log; exit 1; }
          tail -n 9 /tmp/alpha-tests.log
      - name: Existing regression suite
        run: |
          npm test > /tmp/alpha-legacy.log 2>&1 || { tail -n 80 /tmp/alpha-legacy.log; exit 1; }
          tail -n 9 /tmp/alpha-legacy.log
      - name: Install browser test runner
        run: |
          python -m pip install playwright==1.57.0 > /tmp/alpha-browser-install.log 2>&1 || { tail -n 30 /tmp/alpha-browser-install.log; exit 1; }
          python -m playwright install --with-deps chromium >> /tmp/alpha-browser-install.log 2>&1 || { tail -n 30 /tmp/alpha-browser-install.log; exit 1; }
      - name: Shared launcher and two phones, no external game requests
        run: python tests/browser/alpha_smoke.py
      - name: Screenshots and logs
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: alpha-browser
          path: test-results/alpha-browser
          if-no-files-found: ignore
